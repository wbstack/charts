apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "api.fullname" . }}-api-jobmanager
  namespace: {{ .Values.queue.apiJobNamespace }}
  labels:
{{ include "api.labels" . | indent 4 }}
rules:
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "api.fullname" . }}-qs-jobmanager
  namespace: {{ .Values.queue.qsJobNamespace }}
  labels:
{{ include "api.labels" . | indent 4 }}
rules:
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
