{{ if ne .Values.environment "local" -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trivy-operator
  namespace: argocd
spec:
  destination:
    namespace: trivy-system
    server: {{ .Values.clusterUrl }}
  project: {{ .Values.environment }}
  sources:
    - repoURL: oci://ghcr.io/aquasecurity/helm-charts/trivy-operator
      targetRevision: {{ .Values.chartVersions.trivyOperator }}
      chart: trivy-operator
      helm:
        valueFiles:
          - $deployRepo/k8s/argocd/{{ .Values.environment }}/trivy-operator.values.yaml
    - repoURL: {{ .Values.repoUrls.deploy }}
      targetRevision: HEAD
      ref: deployRepo
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
{{- end }}
